[package]
name = "mandate-derive"
version = "0.1.0"
description = "Derive macros (Action, Subject, Resource, IntoValue) for mandate-rs"
readme = "README.md"
documentation = "https://docs.rs/mandate-derive"
keywords = ["authorization", "permissions", "casl", "derive", "proc-macro"]
categories = ["authentication", "web-programming"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
