[package]
name = "mandate-rs"
version = "0.1.0"
description = "A CASL-style authorization library for Rust"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "mandate"

[features]
default = ["derive"]
derive = ["dep:mandate-derive"]
uuid = ["dep:uuid"]
chrono = ["dep:chrono"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"], optional = true }
mandate-derive = { path = "../mandate-derive", optional = true }

[dev-dependencies]
proptest = "1"
trybuild = "1"
